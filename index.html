<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="google-site-verification" content="6XsekYSnrTKEjpIYOTa_YR50zl-dj4neqh1NeEKJlJI" />
        <meta
            name="description"
            content="Bedrock 3D Model Lab - View and interact with 3D models in the browser. Built with WebGL/Three.js."
        />
        <meta
            name="keywords"
            content="Bedrock3DLab, Minecraft Bedrock model editor, Minecraft Bedrock geometry renderer, 3D model renderer, bone editor, WebGL viewer, Three.js, Blockbench, Minecraft Skin Renderer"
        />
        <meta name="author" content="Zulfahmi Fajri" />
        <title>Bedrock 3D Model Lab</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <canvas id="c"></canvas>
        <div id="menu-toggle" class="menu-toggle-button hidden">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6H20M4 12H20M4 18H20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <div id="bone-menu-toggle" class="bone-toggle-button hidden">
            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M6.2 11.73c-1.34.82-2.2.2-2.2-1.23v-1c0-1.42.86-2.04 2.2-1.23l1.87 1.12c1.34.82 1.34 2.13 0 2.95l-1.87 1.12zM17.8 11.73c1.34.82 2.2.2 2.2-1.23v-1c0-1.42-.86-2.04-2.2-1.23l-1.87 1.12c-1.34.82-1.34 2.13 0 2.95l1.87 1.12zM9.96 11.5l4.08.98"
                />
            </svg>
        </div>
        <div id="controls-panel" class="controls">
            <div class="controls-header">
                <div class="title">Bedrock 3D Model Lab Control</div>
                <div id="close-controls" class="close-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M18 6L6 18M6 6L18 18"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>
            </div>
            <div class="control-group">
                <label class="group-label">Model Geometry</label>
                <label for="jsonFile" class="file-trigger" id="jsonFile-label">Select File (.json)...</label>
                <input type="file" id="jsonFile" accept=".json" />
            </div>
            <div class="control-group">
                <label class="group-label">Model Texture</label>
                <label for="textureFile" class="file-trigger" id="textureFile-label">Select File (.png)...</label>
                <input type="file" id="textureFile" accept=".png" />
            </div>
            <div id="geometry-selector-group" class="control-group hidden">
                <label class="group-label" for="geometrySelector">Select Geometry</label>
                <select id="geometrySelector" class="geometry-selector"></select>
            </div>
            <div class="control-group">
                <button id="loadBtn" class="action-button">Load Model</button>
                <button id="exportJsonBtn" class="action-button">Export Edited JSON</button>
                <button id="screenshotBtn" class="action-button">Take Screenshot</button>
                <!-- <div id="bone-menu-container" class="control-group hidden">
                    <label class="group-label">Bone Hierarchy</label>
                    <div id="bone-list" class="bone-list-style"></div>
                </div> -->
            </div>
        </div>
        <div id="bone-menu-container" class="bone-panel hidden">
            <div class="controls-header">
                <div class="title">Bone Hierarchy</div>
            </div>
            <div id="close-bone-panel" class="close-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div id="bone-list" class="bone-list-style"></div>
        </div>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
                }
            }
        </script>

        <script type="module" src="main.js"></script>
        <!-- <button id="screenshotBtn" style="position: absolute; top: 10px; left: 10px; z-index: 10">
            Ambil Screenshot
        </button> -->
    </body>
</html>
